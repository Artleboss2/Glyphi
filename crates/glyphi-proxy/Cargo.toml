[package]
name = "glyphi-proxy"
version = "0.1.0"
edition = "2021"
description = "Local counting proxy for AI providers: one small Rust process, no runtime, no database"
license = "MIT"

[[bin]]
name = "glyphi-proxy"
path = "src/main.rs"

[dependencies]
# Blocking HTTP client with rustls: no async runtime, no OpenSSL, no native build.
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
