[package]
name = "glyphi-app"
description = "Glyphi: the binary that hosts the engine and, later, the window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "glyphi"
path = "src/main.rs"

[dependencies]
glyphi-domain.workspace = true
glyphi-providers.workspace = true
glyphi-store.workspace = true
glyphi-engine.workspace = true
glyphi-shell.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
# Reads the Electron build's `history.sqlite` once, so the port keeps the usage the
# old app had already recorded.
rusqlite.workspace = true

[build-dependencies]
# Embeds the icon and version metadata in the Windows executable.
winres = "0.1"
