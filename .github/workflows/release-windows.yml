name: Release Windows

# One of three independent release pipelines. Each platform builds, tests and
# publishes its own assets to the same `desktop-v<version>` release, so a
# platform that cannot build never blocks the others: the Windows job no longer
# waits on macOS signing, and macOS no longer disappears from a release because
# its Apple secrets are missing.

on:
  push:
    branches: [main]
    paths: ["apps/desktop/package.json"]
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built artifacts as a GitHub release
        type: boolean
        default: false

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
  POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

jobs:
  gate:
    name: Decide what this run publishes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
      - name: Compare the package version against published releases
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REQUESTED: ${{ inputs.publish == true }}
        shell: bash
        run: |-
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::apps/desktop/package.json has an unusable version: ${version}"
            exit 1
          fi
          build=false
          release=false

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # The explicit escape hatch: republishes the declared version as-is.
            build=true
            release="$PUBLISH_REQUESTED"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "desktop-v${version}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match apps/desktop/package.json (${version}). Expected desktop-v${version}."
              exit 1
            fi
            build=true
            release=true
          else
            # A manifest-only dependency edit must not publish the same version.
            # Fetch first so an API failure fails the job instead of looking like
            # an unpublished version. Pagination also covers older releases.
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[].tag_name' > "$RUNNER_TEMP/published-tags"
            if ! grep -Fxq "desktop-v${version}" "$RUNNER_TEMP/published-tags"; then
              build=true
              release=true
            fi
          fi

          {
            echo "build=$build"
            echo "release=$release"
            echo "tag=desktop-v${version}"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "### Glyphi ${version} — Windows" >> "$GITHUB_STEP_SUMMARY"
          echo "- build: \`${build}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- publish: \`${release}\` (\`desktop-v${version}\`)" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows x64
    needs: gate
    if: ${{ needs.gate.outputs.build == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      RELEASE_REQUIRED: ${{ needs.gate.outputs.release }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun ci
      - run: bun run test
      - run: bun run generate:desktop-icons
      - name: Check PostHog token
        shell: bash
        # The main bundle injects an empty key when the secret is absent and the
        # telemetry client then reports itself unconfigured, so a build without it
        # is valid: it just ships without anonymous telemetry.
        run: |-
          if [ -z "${POSTHOG_PROJECT_TOKEN}" ]; then
            echo "::warning::POSTHOG_PROJECT_TOKEN is not set: this build ships with anonymous telemetry disabled. Add the repository secret to include it."
          fi
      - name: Prepare signing
        shell: pwsh
        # An unsigned Windows build is allowed and announced; set WINDOWS_CERTIFICATE_BASE64 to sign.
        run: |-
          if ($env:RELEASE_REQUIRED -eq "true" -and [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Output "::warning::Publishing an unsigned Windows build. Users will see a SmartScreen warning on install. Add WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD to sign."
            "Windows x64 is **unsigned** in this release." | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "glyphi-signing.pfx"
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            "WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - run: bun run desktop:make -- --platform=win32 --arch=x64
      - name: Verify packaged resources
        shell: pwsh
        working-directory: apps/desktop
        run: |-
          $ErrorActionPreference = "Stop"
          $resources = Get-ChildItem "out\Glyphi-win32-x64\resources" -File
          if ($resources.Count -ne 1 -or $resources.Name -ne "app.asar") {
            throw "Unexpected packaged resources: $($resources.Name -join ', ')"
          }
          $entries = & bunx asar list $resources.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "asar list failed with exit code $LASTEXITCODE"
          }
          $normalized = $entries | ForEach-Object { $_ -replace '\\', '/' }
          if ($normalized -notcontains "/.vite/renderer/main_window/index.html") {
            throw "Packaged renderer entry is missing from app.asar. Found $($entries.Count) entries."
          }
      - name: Packaged smoke test
        shell: pwsh
        run: |-
          $env:GLYPHI_SMOKE_TEST = "1"
          & "apps\desktop\out\Glyphi-win32-x64\Glyphi.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify signatures
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |-
          $files = @("apps\desktop\out\Glyphi-win32-x64\Glyphi.exe") +
            @(Get-ChildItem "apps\desktop\out\make" -Recurse -Filter "*.exe" | ForEach-Object FullName)
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne "Valid") { throw "Invalid signature for ${file}: $($signature.Status)" }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-win32-x64
          path: apps/desktop/out/make/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish Windows assets
    needs: [gate, windows]
    if: ${{ success() && needs.gate.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.gate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: desktop-win32-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify the artifact set the update mirror expects
        shell: bash
        # glyphi-cloud cannot map a release with a missing target; catch it before it is public.
        run: |-
          set -euo pipefail
          matches() { find release-artifacts -type f "$@" | wc -l | tr -d ' '; }
          if [[ "$(matches -ipath '*squirrel*' -iname '*.exe')" != "1" ]]; then
            echo "::error::Windows installer: expected 1 artifact"
            find release-artifacts -type f | sort >&2
            exit 1
          fi
          if [[ "$(matches -name RELEASES)" != "1" ]]; then
            echo "::error::Windows RELEASES feed: expected 1 artifact"
            find release-artifacts -type f | sort >&2
            exit 1
          fi
          if [[ "$(matches -ipath '*squirrel*' -iname '*.nupkg')" -lt 1 ]]; then
            echo "::error::Windows update feed has no .nupkg artifact"
            exit 1
          fi
      - name: Generate checksums
        shell: bash
        # Names here must be the ones GitHub publishes, not the build tree's:
        # assets are uploaded flat, and every character outside [A-Za-z0-9._-]
        # is rewritten to "." on the way in, so the Squirrel installer built as
        # "Glyphi-1.2.3 Setup.exe" downloads as "Glyphi-1.2.3.Setup.exe".
        run: |-
          set -euo pipefail
          published_name() { printf '%s' "$1" | tr -c 'A-Za-z0-9._-' '.'; }
          checksum_file="release-artifacts/SHA256SUMS-windows"
          : > "$checksum_file"
          declare -A source_of=()
          while IFS= read -r -d '' file; do
            name="$(published_name "$(basename "$file")")"
            # A collision would also silently clobber one of the two on upload.
            if [[ -n "${source_of[$name]:-}" ]]; then
              echo "::error::${file} and ${source_of[$name]} are both published as ${name}."
              exit 1
            fi
            source_of[$name]="$file"
            printf '%s  %s\n' "$(sha256sum "$file" | cut -d' ' -f1)" "$name" >> "$checksum_file"
          done < <(find release-artifacts -type f -print0 | sort -z)
          sort -k2 -o "$checksum_file" "$checksum_file"
          echo "Recorded $(wc -l < "$checksum_file" | tr -d ' ') Windows asset checksums."
      - name: Create or reuse the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # --target creates the tag at the released commit; ignored when the tag already exists.
        # The macOS and Linux pipelines run at the same time and any of them may win.
        run: |-
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_SHA" \
              --title "Glyphi $RELEASE_VERSION" \
              --generate-notes || true
          fi
          gh release view "$RELEASE_TAG" >/dev/null
      - name: Upload Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |-
          set -euo pipefail
          find release-artifacts -type f -print0 | xargs -0 gh release upload "$RELEASE_TAG" --clobber
