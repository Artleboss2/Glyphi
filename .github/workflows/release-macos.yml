name: Release macOS

# macOS always builds. Without Apple certificates the app ships unsigned: it
# installs and runs after the user clears the download quarantine, instead of
# the whole platform vanishing from a release because signing secrets are
# missing. Adding the APPLE_* secrets later signs and notarizes it with no other
# change.

on:
  push:
    branches: [main]
    paths: ["apps/desktop/package.json"]
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built artifacts as a GitHub release
        type: boolean
        default: false

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
  POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

jobs:
  gate:
    name: Decide what this run publishes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
      - name: Compare the package version against published releases
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REQUESTED: ${{ inputs.publish == true }}
        shell: bash
        run: |-
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::apps/desktop/package.json has an unusable version: ${version}"
            exit 1
          fi
          build=false
          release=false

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            build=true
            release="$PUBLISH_REQUESTED"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "desktop-v${version}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match apps/desktop/package.json (${version}). Expected desktop-v${version}."
              exit 1
            fi
            build=true
            release=true
          else
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[].tag_name' > "$RUNNER_TEMP/published-tags"
            if ! grep -Fxq "desktop-v${version}" "$RUNNER_TEMP/published-tags"; then
              build=true
              release=true
            fi
          fi

          {
            echo "build=$build"
            echo "release=$release"
            echo "tag=desktop-v${version}"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "### Glyphi ${version} — macOS" >> "$GITHUB_STEP_SUMMARY"
          echo "- build: \`${build}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- publish: \`${release}\` (\`desktop-v${version}\`)" >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS ${{ matrix.arch }}
    needs: gate
    if: ${{ needs.gate.outputs.build == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    env:
      RELEASE_REQUIRED: ${{ needs.gate.outputs.release }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun ci
      - run: bun run test
        if: ${{ matrix.arch == 'x64' }}
      - name: Check PostHog token
        shell: bash
        run: |-
          if [ -z "${POSTHOG_PROJECT_TOKEN}" ]; then
            echo "::warning::POSTHOG_PROJECT_TOKEN is not set: this build ships with anonymous telemetry disabled. Add the repository secret to include it."
          fi
      - name: Generate macOS icon
        shell: bash
        run: |-
          set -euo pipefail
          source_png="apps/desktop/resources/icons/glyphi.png"
          iconset="$RUNNER_TEMP/glyphi.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" "$source_png" --out "$iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" "$source_png" --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o apps/desktop/resources/installer/glyphi.icns
      - name: Prepare signing and notarization
        shell: bash
        # A partial Apple setup is a configuration error; none at all just means an
        # unsigned build, which is announced in the run summary and the release.
        run: |-
          set -euo pipefail
          if [[ -n "$APPLE_CERTIFICATE_BASE64" || -n "$APPLE_SIGNING_IDENTITY" || -n "$APPLE_API_KEY_BASE64" ]]; then
            if [[ -z "$APPLE_CERTIFICATE_BASE64" || -z "$APPLE_SIGNING_IDENTITY" ||
                  -z "$APPLE_API_KEY_BASE64" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER" ]]; then
              echo "::error::Apple signing needs APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_API_KEY_BASE64, APPLE_API_KEY_ID and APPLE_API_ISSUER together. Remove all of them to publish unsigned builds instead."
              exit 1
            fi
            certificate_path="$RUNNER_TEMP/glyphi-signing.p12"
            keychain_path="$RUNNER_TEMP/glyphi-signing.keychain-db"
            keychain_password="glyphi-ci-$GITHUB_RUN_ID"
            printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$certificate_path"
            certificate_bytes="$(wc -c < "$certificate_path" | tr -d ' ')"
            if ! openssl pkcs12 -in "$certificate_path" -passin env:APPLE_CERTIFICATE_PASSWORD -noout >/dev/null 2>&1; then
              echo "::error::The Apple certificate secret is not a valid PKCS#12 bundle for the supplied password (decoded ${certificate_bytes} bytes). Replace APPLE_CERTIFICATE_BASE64 and APPLE_CERTIFICATE_PASSWORD from the same local credential file."
              exit 1
            fi
            security create-keychain -p "$keychain_password" "$keychain_path"
            security set-keychain-settings -lut 21600 "$keychain_path"
            security unlock-keychain -p "$keychain_password" "$keychain_path"
            security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
            security list-keychains -d user -s "$keychain_path"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
            api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
            echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Building macOS unsigned: Gatekeeper will ask for confirmation on first launch. Add the APPLE_* secrets to sign and notarize."
            {
              echo "macOS ${{ matrix.arch }} is **unsigned** in this release."
              echo ""
              echo "If macOS refuses to open it, run \`xattr -dr com.apple.quarantine /Applications/Glyphi.app\` once."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi
      - run: bun run desktop:make -- --platform=darwin --arch=${{ matrix.arch }}
      - name: Packaged smoke test
        shell: bash
        run: GLYPHI_SMOKE_TEST=1 "apps/desktop/out/Glyphi-darwin-${{ matrix.arch }}/Glyphi.app/Contents/MacOS/Glyphi"
      - name: Verify signature and notarization
        if: ${{ env.SIGNED == 'true' }}
        shell: bash
        run: |-
          app_path="apps/desktop/out/Glyphi-darwin-${{ matrix.arch }}/Glyphi.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-darwin-${{ matrix.arch }}
          path: apps/desktop/out/make/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish macOS assets
    needs: [gate, macos]
    if: ${{ success() && needs.gate.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.gate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: desktop-darwin-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify the artifact set the update mirror expects
        shell: bash
        run: |-
          set -euo pipefail
          matches() { find release-artifacts -type f "$@" | wc -l | tr -d ' '; }
          failed=0
          for arch in x64 arm64; do
            if [[ "$(matches -iname '*.dmg' -ipath "*${arch}*")" != "1" ]]; then
              echo "::error::macOS ${arch} disk image: expected 1 artifact"
              failed=1
            fi
            if [[ "$(matches -iname '*.zip' -ipath '*darwin*' -ipath "*${arch}*")" != "1" ]]; then
              echo "::error::macOS ${arch} update ZIP: expected 1 artifact"
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "Artifacts produced by this run:" >&2
            find release-artifacts -type f | sort >&2
            exit 1
          fi
      - name: Generate checksums
        shell: bash
        run: |-
          set -euo pipefail
          published_name() { printf '%s' "$1" | tr -c 'A-Za-z0-9._-' '.'; }
          checksum_file="release-artifacts/SHA256SUMS-macos"
          : > "$checksum_file"
          while IFS= read -r -d '' file; do
            printf '%s  %s\n' "$(sha256sum "$file" | cut -d' ' -f1)" "$(published_name "$(basename "$file")")" >> "$checksum_file"
          done < <(find release-artifacts -type f -print0 | sort -z)
          sort -k2 -o "$checksum_file" "$checksum_file"
          echo "Recorded $(wc -l < "$checksum_file" | tr -d ' ') macOS asset checksums."
      - name: Create or reuse the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |-
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_SHA" \
              --title "Glyphi $RELEASE_VERSION" \
              --generate-notes || true
          fi
          gh release view "$RELEASE_TAG" >/dev/null
      - name: Upload macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |-
          set -euo pipefail
          find release-artifacts -type f -print0 | xargs -0 gh release upload "$RELEASE_TAG" --clobber
